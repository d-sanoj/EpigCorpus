[project]
name = "epigcorpus"
version = "1.0.0"
description = "EpigCorpus backend: EDCS harvest, cleaning, search index and HTTP API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "geopandas>=1.1.1",
    "matplotlib>=3.10.7",
    "pandas>=3.0.1",
    "pyarrow>=21.0.0",
    "requests>=2.33.0",
    "uvicorn>=0.48.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epigcorpus"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
]
ml = [
    "protobuf>=7.35.0",
    "scikit-learn>=1.9.0",
    "sentencepiece>=0.2.2",
    "tokenizers>=0.22.2",
    "torch>=2.13.0",
    "transformers>=5.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# The research scripts live outside backend/ (research/scripts) and are not
# linted; they carried 532 findings at the time of the app/ restructure (see
# docs/refactor/baseline.md).

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Lint debt baseline, recorded 2026-08-19 (Phase 0).
#
# Phase 0 is documentation and test infrastructure only and must not modify
# pipeline code, so the 28 pre-existing findings in these four modules are
# suppressed here rather than fixed. They are NOT waived:
#   E501   long lines           -> cleared by T38 (logging) / T40 (docs)
#   UP015  redundant open modes -> T38
#   F541   f-strings w/o fields -> T38 (all are print() calls being replaced)
#   SIM115 open() w/o context   -> T19 (scrape() leaks file handles on failure)
#   SIM105 suppressible except  -> T19 / T30
#   I001   unsorted imports      -> cleared whenever each module is next touched
# Each entry must be deleted as its task lands. Do not add files to this list.
#
# 2026-10-23, app/ restructure: the four modules were split into layers and
# each finding moved with its line, so the entries now name the module the
# line lives in. Entries were then cut to the codes that still fire; nothing
# new was suppressed. Remaining: E501 (T38/T40) in core/search.py,
# services/search.py, adapters/map_layers.py, cli/main.py; SIM115 (T19) in
# adapters/harvest_store.py, where scrape()'s file handles now live in
# CorpusWriter. The Streamlit module and its entry went with Streamlit.
#
# 2026-10-24, backend/ layout: keys re-rooted to backend/; cli/main.py went
# with the command line.
[tool.ruff.lint.per-file-ignores]
"src/epigcorpus/core/search.py"            = ["E501"]
"src/epigcorpus/services/search.py"        = ["E501"]
"src/epigcorpus/adapters/map_layers.py"    = ["E501"]
"src/epigcorpus/adapters/harvest_store.py" = ["SIM115"]
