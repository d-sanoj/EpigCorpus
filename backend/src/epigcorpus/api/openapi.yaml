openapi: 3.1.0
info:
  title: EpigCorpus API
  version: 1.0.0
  summary: Search, read, export and harvest Latin inscriptions from the EDCS.
  description: |
    The EpigCorpus HTTP API. This document is the contract: it was written
    before the implementation (`docs/adr/0002-api-first-design.md`), the
    implementation in `backend/src/epigcorpus/api` is tested against it
    (`backend/tests/api/test_contract.py`), and the server returns it at
    `/api/v1/openapi.yaml`. Every operation maps onto a use case in
    `epigcorpus.services`; `backend/src/epigcorpus/api/README.md` lists which
    one. The web UI in `frontend/` is a client of this API, and its
    TypeScript types are generated from this file.

    ## Conventions

    - **Versioning.** Every path starts with `/api/v1`. Breaking changes get `/api/v2`;
      additive changes (new optional fields, parameters, operations) do not.
    - **Pagination** is cursor-based. List operations take `limit` (1–500,
      default 50; up to 25,000 for places) and an opaque `cursor`, and return `page.next_cursor`
      (`null` on the last page) plus a `Link: <…>; rel="next"` header. A cursor
      is bound to the query that produced it: reusing it with different
      filters is a `400`.
    - **Errors** are `application/problem+json` (RFC 9457) with `type`,
      `title`, `status`, `detail`, `instance`; validation errors add `errors[]`.
    - **Search semantics** are exactly those of the existing map search
      (`epigcorpus.core.search`):
      - `q` is a case-insensitive **substring** match — not a regular
        expression, not tokenised — against the text column selected by
        `search_in`: `raw` → `inscription_text`, `interpretive` →
        `inscription_text_interpretive`, `conservative` →
        `inscription_text_conservative`.
      - `material`, `province` and `place` match a value **exactly**.
        `category` and `language` match on **token overlap**: `category_en`
        is a list and `language` is comma-joined, so `language=Latin` matches
        `"Greek, Latin"`.
      - Each filter may be repeated (`province=Noricum&province=Dalmatia`);
        values within one filter are alternatives (OR); different filters
        must all hold (AND).
      - Search, list and places operate on the **map's search frame**: rows
        with coordinates inside the Roman Empire bounding box
        (latitude 20–62, longitude −12–50), 568,560 of the 588,509 rows in
        the current snapshot. Reading one inscription by id uses the full
        corpus. Whether the API should keep the bounding box is an open
        question recorded in `backend/src/epigcorpus/api/README.md`.

    ## Authentication

    The API will be protected with **OAuth 2.0 / OpenID Connect**. Which flows
    are offered (for example authorization code with PKCE for the browser UI,
    client credentials for automation) and which scopes guard which
    operations (starting and cancelling pipeline runs at minimum) are not
    decided here; that decision is open in
    `docs/adr/0003-api-authentication.md` (status: proposed). The
    `openIdConnect` scheme below is declared so tooling can see it, but no
    operation requires it in this draft.
  license:
    name: MIT (code). Inscription data carries the EDCS terms.
    identifier: MIT
  contact:
    name: EpigCorpus
    url: https://github.com/d-sanoj/EpigCorpus

servers:
  - url: http://127.0.0.1:8000
    description: Local server (uv run uvicorn epigcorpus.api.server:app, from backend/)

tags:
  - name: meta
    description: Health.
  - name: inscriptions
    description: Search, list and read inscription records.
  - name: variants
    description: The raw text and its two cleaned variants.
  - name: places
    description: Inscriptions aggregated per findspot, as the map draws them.
  - name: map
    description: Historical map layers (provinces, roads, cities).
  - name: exports
    description: Whole-corpus and search-result downloads.
  - name: lookups
    description: EDCS code tables and the filter values present in the corpus.
  - name: pipeline-runs
    description: Harvest from the EDCS, clean, and reload the corpus, in the background.

paths:
  /api/v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness, and whether the corpus is loaded
      description: |
        The server loads the corpus in the background at startup (about a
        minute for the full snapshot). Until `ready` is true, read operations
        wait for the load to finish rather than failing.
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                loading:
                  value: {status: ok, ready: false}
                ready:
                  value: {status: ok, ready: true}

  /api/v1/inscriptions:
    get:
      tags: [inscriptions]
      operationId: listInscriptions
      summary: List inscriptions, optionally filtered
      description: |
        Pages through the search frame, narrowed by the attribute filters.
        No keyword: use `/api/v1/inscriptions/search` for text search. With no
        filters this pages through every inscription in the frame.
      parameters:
        - $ref: '#/components/parameters/Material'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/Province'
        - $ref: '#/components/parameters/Place'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of inscriptions.
          headers:
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InscriptionPage'
              examples:
                noricumLatin:
                  summary: "province=Noricum&language=Latin&limit=1: 4,606 matches"
                  value:
                    data:
                      - record_id: EDCS-00000001-0
                        edcs_id: EDCS-00000001
                        province: Noricum
                        place: Maribor / Marburg
                        latitude: 46.55563
                        longitude: 15.64477
                        not_before: null
                        not_after: null
                        language: Latin
                        material_en: stone
                        category_en: [tomb inscriptions, men, first name and gentile name, 'municipal magistrates, priests and councillors']
                        inscription_text: "?] C(aius) Trebonius IIvir et praef(ectus) i(ure) d(icundo) civitatis Agunti [?"
                        inscription_text_interpretive: Caius Trebonius II vir et praefectus iure dicundo civitatis Agunti
                        inscription_text_conservative: C Trebonius II vir et praef i d civitatis Agunti
                    page:
                      limit: 1
                      total: 4606
                      next_cursor: eyJvIjoxLCJxIjoiYjM3YyJ9
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/inscriptions/search:
    get:
      tags: [inscriptions]
      operationId: searchInscriptions
      summary: Keyword search, combinable with the filters
      description: |
        Case-insensitive substring search of `q` in the column chosen by
        `search_in`, then narrowed by the filters. Same results, in the same
        order, as the map's search for the same inputs.
      parameters:
        - $ref: '#/components/parameters/QRequired'
        - $ref: '#/components/parameters/SearchIn'
        - $ref: '#/components/parameters/Material'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/Province'
        - $ref: '#/components/parameters/Place'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of matching inscriptions.
          headers:
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InscriptionPage'
              examples:
                viator:
                  summary: "q=viator in raw text: 515 matches"
                  value:
                    data:
                      - record_id: EDCS-00000144-0
                        edcs_id: EDCS-00000144
                        province: Germania superior
                        place: Avenches / Aventicum
                        latitude: 46.87961
                        longitude: 7.04087
                        not_before: 30
                        not_after: 74
                        language: Latin
                        material_en: iron
                        category_en: ["manufacturer's inscriptions", owner inscriptions]
                        inscription_text: Viator(is)?
                        inscription_text_interpretive: Viatoris
                        inscription_text_conservative: Viator
                    page:
                      limit: 1
                      total: 515
                      next_cursor: eyJvIjoxLCJxIjoiOWYxZSJ9
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/inscriptions/{record_id}:
    get:
      tags: [inscriptions]
      operationId: getInscription
      summary: Read one inscription, every column
      description: Reads from the full cleaned corpus, not the bounded search frame.
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: The inscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inscription'
              examples:
                edcs1:
                  $ref: '#/components/examples/InscriptionEdcs1'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/inscriptions/{record_id}/variants:
    get:
      tags: [variants]
      operationId: getInscriptionVariants
      summary: The raw text and both cleaned variants
      description: |
        `conservative` approximates what is carved on the stone (expansions
        dropped, inscribed letters kept where the editors corrected them);
        `interpretive` is the editors' reading (expansions kept, corrections
        applied). Produced by the cleaning rules in `epigcorpus.core.cleaning`.
        A variant that cleans to nothing is `null`.
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: All three texts and the two flags the cleaner sets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variants'
              examples:
                edcs1:
                  value:
                    record_id: EDCS-00000001-0
                    raw: "?] C(aius) Trebonius IIvir et praef(ectus) i(ure) d(icundo) civitatis Agunti [?"
                    conservative: C Trebonius II vir et praef i d civitatis Agunti
                    interpretive: Caius Trebonius II vir et praefectus iure dicundo civitatis Agunti
                    is_unreadable: false
                    is_forged: false
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/inscriptions/{record_id}/variants/{variant}:
    get:
      tags: [variants]
      operationId: getInscriptionVariant
      summary: One text variant
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - name: variant
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/VariantName'
          example: interpretive
      responses:
        '200':
          description: The requested text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
              examples:
                interpretive:
                  value:
                    record_id: EDCS-00000001-0
                    variant: interpretive
                    text: Caius Trebonius II vir et praefectus iure dicundo civitatis Agunti
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/places:
    get:
      tags: [places]
      operationId: listResultPlaces
      summary: Places matching a query, with counts and example inscriptions
      description: |
        Aggregates the inscriptions a query matches into one row per place
        (coordinates rounded to 5 decimals), with up to 8 example
        inscriptions each, as the map's result layer. `q` is optional here;
        with neither `q` nor a filter every place in the search frame is
        returned. Ordered by `count` ascending, then by first appearance.
      parameters:
        - $ref: '#/components/parameters/QOptional'
        - $ref: '#/components/parameters/SearchIn'
        - $ref: '#/components/parameters/Material'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/Province'
        - $ref: '#/components/parameters/Place'
        - $ref: '#/components/parameters/PlacesLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of places.
          headers:
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPlacePage'
              examples:
                viatorLargest:
                  summary: "q=viator: the place with the most matches"
                  value:
                    summary:
                      inscriptions: 515
                      places: 257
                      title: Inscriptions matching "viator"
                      subtitle: Searched in raw inscription text
                    data:
                      - place: Roma
                        latitude: 41.89332
                        longitude: 12.48293
                        count: 131
                        examples:
                          - "EDCS-00600842 · D(is) M(anibus) / Felici filio / dulcissimo / Viator et / Spes parent(es) / fec(erunt) vix(it) a(nnos) III / mens(es) IV d(ies) XXI"
                          - "EDCS-02700829 · D(is) M(anibus) / L(uci) Passieni / Eutychetis / viatoris / consular(is)"
                    page:
                      limit: 1
                      total: 257
                      next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/places/known:
    get:
      tags: [places]
      operationId: listKnownPlaces
      summary: Every known place with its inscription count
      description: |
        Every place in the search frame with its inscription count, plus
        places the EDCS lookup knows inside the bounding box that carry no
        inscription (count 0). This is the map's corpus-wide layer. Ordered by
        `count` ascending.
      parameters:
        - $ref: '#/components/parameters/PlacesLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of places.
          headers:
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacePage'
              examples:
                firstPage:
                  value:
                    summary:
                      places: 21999
                      inscriptions: 568560
                    data:
                      - place: Crastes / Ausci / Eliumberrum
                        latitude: 43.72347
                        longitude: 0.72958
                        count: 1
                    page:
                      limit: 1
                      total: 21999
                      next_cursor: eyJvIjoxfQ
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/places.geojson:
    get:
      tags: [places]
      operationId: getResultPlacesGeoJson
      summary: Places matching a query, as GeoJSON
      description: |
        The same places as `GET /api/v1/places`, all of them in one GeoJSON
        FeatureCollection rather than paged: what a map needs to draw the
        result layer in one request. Each feature's properties are `place`,
        `count` and `examples`; the query's summary rides along as the
        foreign member `summary`.
      parameters:
        - $ref: '#/components/parameters/QOptional'
        - $ref: '#/components/parameters/SearchIn'
        - $ref: '#/components/parameters/Material'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/Province'
        - $ref: '#/components/parameters/Place'
      responses:
        '200':
          description: Every matching place.
          content:
            application/geo+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlaceFeatureCollection'
                  - type: object
                    properties:
                      summary:
                        type: object
                        required: [inscriptions, places, title, subtitle]
                        properties:
                          inscriptions: {type: integer}
                          places: {type: integer}
                          title: {type: string}
                          subtitle: {type: string}
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/places/known.geojson:
    get:
      tags: [places]
      operationId: getKnownPlacesGeoJson
      summary: Every known place, as GeoJSON
      description: |
        The same places as `GET /api/v1/places/known`, all of them in one
        GeoJSON FeatureCollection. Properties are `place` and `count`.
      responses:
        '200':
          description: Every known place.
          content:
            application/geo+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlaceFeatureCollection'
                  - type: object
                    properties:
                      summary:
                        type: object
                        required: [places, inscriptions]
                        properties:
                          places: {type: integer}
                          inscriptions: {type: integer}

  /api/v1/map/layers/provinces:
    get:
      tags: [map]
      operationId: getProvincesLayer
      summary: Roman provinces, AD 117, as GeoJSON
      description: |
        AWMC province boundaries, simplified (tolerance 0.01°) and pre-coloured
        (`_color`) for drawing. Static: send `If-None-Match` to revalidate.
      responses:
        '200':
          description: A GeoJSON FeatureCollection.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
              examples:
                oneFeature:
                  value:
                    type: FeatureCollection
                    features:
                      - type: Feature
                        properties: {_color: '#5b4b8a'}
                        geometry:
                          type: Polygon
                          # first three vertices of the first ring; truncated
                          coordinates: [[[-1.57431, 55.16792], [-1.50632, 54.98433], [-1.45197, 54.99405]]]
        '304':
          $ref: '#/components/responses/NotModified'

  /api/v1/map/layers/roads:
    get:
      tags: [map]
      operationId: getRoadsLayer
      summary: Roman roads (Barrington Atlas) as GeoJSON
      description: AWMC road network, simplified (tolerance 0.02°). Static.
      responses:
        '200':
          description: A GeoJSON FeatureCollection of LineStrings.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
              examples:
                oneRoad:
                  value:
                    type: FeatureCollection
                    features:
                      - type: Feature
                        properties: {}
                        geometry:
                          type: LineString
                          # first three vertices; truncated
                          coordinates: [[26.97074, 39.53252], [27.23296, 39.78384], [27.39479, 39.84867]]
        '304':
          $ref: '#/components/responses/NotModified'

  /api/v1/map/layers/land:
    get:
      tags: [map]
      operationId: getLandLayer
      summary: Land outlines, the map's background
      description: |
        Natural Earth 1:50m land, clipped to the Roman world (longitude
        −35 to 80, latitude 0 to 75) and simplified (tolerance 0.02°). The
        web map draws it instead of a tile basemap, so the background needs no
        tile service, no API key and no network, and carries no labels.
        Static: send `If-None-Match`.
      responses:
        '200':
          description: A GeoJSON FeatureCollection of polygons.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
              examples:
                oneIsland:
                  value:
                    type: FeatureCollection
                    features:
                      - type: Feature
                        properties: {}
                        geometry:
                          type: Polygon
                          # first vertices only; truncated
                          coordinates: [[[14.5, 35.9], [14.6, 35.8], [14.4, 35.8], [14.5, 35.9]]]
        '304':
          $ref: '#/components/responses/NotModified'

  /api/v1/map/layers/province-labels:
    get:
      tags: [map]
      operationId: getProvinceLabels
      summary: Where to write each EDCS province's name, and in what colour
      description: |
        One label per EDCS province, ordered by inscription count (largest
        first, so a client that hides overlapping labels keeps the largest).
        The province layer has no names and its polygons are not one per
        province, so the names come from the corpus: each label sits at the
        median latitude and longitude of the province's places, coloured like
        the shaded polygon under that point (or the nearest within 0.75°),
        and `null` when there is none. Static: send `If-None-Match`.
      responses:
        '200':
          description: All labels.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProvinceLabel'
              examples:
                largest:
                  value:
                    - name: Roma
                      latitude: 41.92516
                      longitude: 12.44663
                      inscriptions: 132109
                      places: 9
                      color: '#8a4f4f'
                    - name: Armenia
                      latitude: 39.92157
                      longitude: 44.29306
                      inscriptions: 5
                      places: 3
                      color: null
        '304':
          $ref: '#/components/responses/NotModified'

  /api/v1/map/layers/cities:
    get:
      tags: [map]
      operationId: getCitiesLayer
      summary: Roman cities (Hanson 2016) as labelled points
      description: |
        1,388 cities from the OXREP database. The label is the ancient
        toponym, `/ modern toponym` when it differs, then the province.
      responses:
        '200':
          description: All cities.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CityPoint'
              examples:
                roma:
                  value:
                    - latitude: 41.89278
                      longitude: 12.4851
                      label: Roma / Rome, Italia (VII Etruria)
        '304':
          $ref: '#/components/responses/NotModified'

  /api/v1/exports/corpus.jsonl:
    get:
      tags: [exports]
      operationId: exportCorpusJsonl
      summary: Download the raw corpus as JSON Lines
      description: |
        The scraped corpus, one inscription per line, list-valued columns as
        JSON arrays. Served gzip-compressed when the client sends
        `Accept-Encoding: gzip` (the stored form).
      responses:
        '200':
          $ref: '#/components/responses/JsonlDownload'

  /api/v1/exports/corpus.tsv:
    get:
      tags: [exports]
      operationId: exportCorpusTsv
      summary: Download the raw corpus as TSV
      description: |
        Same records as the JSONL, tab-separated with a header row;
        list-valued columns (`category`, `category_en`, `belege`, `status`,
        `language_codes`) are joined with `" | "`.
      responses:
        '200':
          $ref: '#/components/responses/TsvDownload'

  /api/v1/exports/cleaned.jsonl:
    get:
      tags: [exports]
      operationId: exportCleanedJsonl
      summary: Download the cleaned corpus as JSON Lines
      description: |
        The corpus with `inscription_text_conservative`,
        `inscription_text_interpretive`, `is_unreadable` and `is_forged`
        added, and `belege` renamed to `evidence`.
      responses:
        '200':
          $ref: '#/components/responses/JsonlDownload'

  /api/v1/exports/search.tsv:
    get:
      tags: [exports]
      operationId: exportSearchTsv
      summary: Download a query's results as TSV
      description: |
        The map's "Download TSV": every column of the cleaned corpus for the
        query's results, as `edcs_search_results.tsv`. Note the current
        behaviour this preserves: rows are selected by **monument**
        (`edcs_id`), so every inscription on a matching monument is included
        — for `q=viator`, 515 matching inscriptions give 927 rows.
        At least one of `q` or a filter is required.
      parameters:
        - $ref: '#/components/parameters/QOptional'
        - $ref: '#/components/parameters/SearchIn'
        - $ref: '#/components/parameters/Material'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/Province'
        - $ref: '#/components/parameters/Place'
      responses:
        '200':
          description: The results table.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="edcs_search_results.tsv"
          content:
            text/tab-separated-values:
              schema:
                type: string
              examples:
                viator:
                  value: "edcs_id\tprovince\tplace\tlatitude\tlongitude\t…\tis_unreadable\tis_forged\nEDCS-00000144\tGermania superior\tAvenches / Aventicum\t46.87961\t7.04087\t…\tFalse\tFalse\n"
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/exports/map.png:
    get:
      tags: [exports]
      operationId: exportMapPng
      summary: Download the map as a publication-style PNG
      description: |
        The map's "Download as PNG". With a keyword or any filter it plots the
        query's places in tangerine, titled with the query in words; with
        neither it plots every known place in teal. Dark palette, provinces,
        roads, cities, size legend, footer and citation, as the old map's
        export. The file name follows the query: `edcs_map_<term>.png`,
        `edcs_map_filtered.png` or `edcs_map_all_known_places.png`.
      parameters:
        - $ref: '#/components/parameters/QOptional'
        - $ref: '#/components/parameters/SearchIn'
        - $ref: '#/components/parameters/Material'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/Province'
        - $ref: '#/components/parameters/Place'
      responses:
        '200':
          description: The PNG (11.8 x 8.6 in at 180 dpi).
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="edcs_map_viator.png"
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/lookups:
    get:
      tags: [lookups]
      operationId: getLookups
      summary: All EDCS code tables
      description: |
        The flattened code tables saved by the last harvest
        (`data/reference/edcs_lookup.json`): materials, categories,
        provinces, languages, places and citation sources. About 3 MB; prefer
        `/api/v1/lookups/{table}` for one table.
      responses:
        '200':
          description: Every table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lookups'
              examples:
                excerpt:
                  summary: One entry per table
                  value:
                    materials: {'1': {token: aes, en: bronze}}
                    categories: {'21': {token: Augusti/Augustae, en: emperor/emperess}}
                    provinces: [Achaia]
                    languages: {'1': {en: Etruscan, code: et}}
                    places: {'110002': {ort: Afesou, province: Achaia, lat: '', lon: ''}}
                    sources: {'2': AA}
                    _meta: {retrieved_at: '2026-08-19T20:29:07Z', epigcorpus_version: 0.2.0}
        '503':
          $ref: '#/components/responses/LookupUnavailable'

  /api/v1/lookups/{table}:
    get:
      tags: [lookups]
      operationId: getLookupTable
      summary: One EDCS code table
      parameters:
        - name: table
          in: path
          required: true
          schema:
            type: string
            enum: [materials, categories, provinces, languages, places, sources]
          example: materials
      responses:
        '200':
          description: The table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTable'
              examples:
                materials:
                  value:
                    table: materials
                    entries: {'1': {token: aes, en: bronze}, '2': {token: argentum, en: silver}}
                provinces:
                  value:
                    table: provinces
                    entries: [Achaia, Aegyptus, Aemilia / Regio VIII]
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LookupUnavailable'

  /api/v1/facets:
    get:
      tags: [lookups]
      operationId: getFacets
      summary: Values each filter can take, with their short forms
      description: |
        The distinct values present in the search frame for each filter (the
        map's dropdown options), and the EDCS short form (Latin token or
        language code) for each English value where one exists.
      responses:
        '200':
          description: Filter values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facets'
              examples:
                excerpt:
                  value:
                    values:
                      material: [amber, bone, brass]
                      province: [Achaia, Aegyptus, Aemilia / Regio VIII]
                      place: ["'Ain Beida", "'Ain Khalfoun", "'Ain Loulou"]
                      category: [Roman knights, boundary stones, building inscriptions]
                      language: [Etruscan, Greek, Hebrew]
                    short_forms:
                      material: {bronze: aes, silver: argentum}
                      category: {emperor/emperess: Augusti/Augustae, epigrammes: carmina}
                      language: {Etruscan: et, Greek: gr}

  /api/v1/pipeline-runs:
    post:
      tags: [pipeline-runs]
      operationId: startPipelineRun
      summary: Start a pipeline run (asynchronous)
      description: |
        Starts the pipeline in the background and returns at once with `202`
        and the run's URL in `Location`; poll `GET /api/v1/pipeline-runs/{run_id}`.
        A run has up to three stages, in this order:

        1. `harvest` fetches monuments from the EDCS into the raw corpus.
           It is incremental and resumable: without `restart` it resumes
           from the checkpoint, and an already complete corpus ends the stage
           with result `already_complete` without touching it.
           `restart: true` **deletes** the existing raw output first.
        2. `clean` derives the conservative and interpretive variants from
           the newest raw corpus and saves the cleaned corpus.
        3. `reload` loads the cleaned corpus into a fresh catalog and swaps
           it in while the server keeps answering. Every later request reads
           the new corpus; cursors issued before the swap become invalid.

        `harvest: false` cleans the corpus already on disk; `clean: false`
        only harvests. `reload` always follows `clean`. Only one run can be
        active at a time (there is one checkpoint and one corpus), so a second
        start while one is queued or running is a `409`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
            examples:
              smokeTest:
                summary: Harvest the first 500 monuments gently, then clean and reload
                value: {limit: 500, workers: 8}
              cleanOnly:
                summary: Re-clean the raw corpus on disk and reload
                value: {harvest: false}
              full:
                summary: Resume or complete the full harvest, clean, reload
                value: {}
      responses:
        '202':
          description: The run was accepted.
          headers:
            Location:
              description: URL of the new run.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/pipeline-runs/3f6c1a52-8e7b-4d0e-9a51-0c2f1f4e7b10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
              examples:
                queued:
                  $ref: '#/components/examples/PipelineRunQueued'
        '409':
          description: A run is already queued or running.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                busy:
                  value:
                    type: https://epigcorpus.example/problems/pipeline-run-active
                    title: A pipeline run is already in progress
                    status: 409
                    detail: Run 3f6c1a52-8e7b-4d0e-9a51-0c2f1f4e7b10 is running; cancel it or wait for it to finish.
                    instance: /api/v1/pipeline-runs
                    running_run: /api/v1/pipeline-runs/3f6c1a52-8e7b-4d0e-9a51-0c2f1f4e7b10
        '422':
          $ref: '#/components/responses/ValidationFailed'
    get:
      tags: [pipeline-runs]
      operationId: listPipelineRuns
      summary: Recent pipeline runs, newest first
      description: |
        The runs this server process remembers: the active one, if any, and
        up to the 20 most recent finished ones. A restart forgets them.
      responses:
        '200':
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/PipelineRun'}

  /api/v1/pipeline-runs/{run_id}:
    get:
      tags: [pipeline-runs]
      operationId: getPipelineRun
      summary: Status, stages and progress of a run
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
              examples:
                harvesting:
                  $ref: '#/components/examples/PipelineRunHarvesting'
                succeeded:
                  $ref: '#/components/examples/PipelineRunSucceeded'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pipeline-runs/{run_id}/cancel:
    post:
      tags: [pipeline-runs]
      operationId: cancelPipelineRun
      summary: Ask a run to stop (asynchronous)
      description: |
        Requests a stop and returns `202` with the run in status `cancelling`;
        poll it for the final state. A harvest finishes its current chunk,
        flushes its output and writes the checkpoint, so a later run resumes
        where it stopped. Stages that have not started are skipped. Cleaning
        cannot be interrupted, and once it has saved the cleaned corpus the
        reload still runs, so the server never answers from an older corpus
        than the one on disk; such a run ends `succeeded`.
        Cancelling a finished run is a `409`; cancelling a cancelling run is
        a no-op `202`.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '202':
          description: Stop requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
              examples:
                cancelling:
                  $ref: '#/components/examples/PipelineRunCancelling'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The run has already finished.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                finished:
                  value:
                    type: https://epigcorpus.example/problems/pipeline-run-finished
                    title: The run has already finished
                    status: 409
                    detail: Run 3f6c1a52-8e7b-4d0e-9a51-0c2f1f4e7b10 ended with status succeeded.
                    instance: /api/v1/pipeline-runs/3f6c1a52-8e7b-4d0e-9a51-0c2f1f4e7b10/cancel

components:
  securitySchemes:
    openIdConnect:
      type: openIdConnect
      description: |
        Declared, not enforced. Flows and scopes are decided in
        docs/adr/0003-api-authentication.md (proposed). The URL is a
        placeholder.
      openIdConnectUrl: https://auth.example.invalid/.well-known/openid-configuration

  parameters:
    QRequired:
      name: q
      in: query
      required: true
      description: Case-insensitive substring to find in the `search_in` column. Not a regex.
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: viator
    QOptional:
      name: q
      in: query
      required: false
      description: Case-insensitive substring to find in the `search_in` column. Not a regex.
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: viator
    SearchIn:
      name: search_in
      in: query
      required: false
      description: |
        Which text `q` is matched against: `raw` (inscription_text, EDCS
        markup intact), `interpretive` or `conservative`. The map's labels are
        "Raw inscriptions", "Interpretive Cleaned Inscriptions" and
        "Conservative Cleaned Inscriptions".
      schema:
        $ref: '#/components/schemas/SearchIn'
      example: raw
    Material:
      name: material
      in: query
      required: false
      description: English material label, exact match (`material_en`). Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: {type: string}
      example: [stone, marble]
    Category:
      name: category
      in: query
      required: false
      description: English category label; matches when any of the inscription's categories (`category_en`) is listed. Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: {type: string}
      example: [tomb inscriptions]
    Language:
      name: language
      in: query
      required: false
      description: Language name; matches when any of the inscription's languages is listed (`Latin` matches `Greek, Latin`). Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: {type: string}
      example: [Latin]
    Province:
      name: province
      in: query
      required: false
      description: Province, exact match. Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: {type: string}
      example: [Noricum, Dalmatia]
    Place:
      name: place
      in: query
      required: false
      description: Findspot, exact match. Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: {type: string}
      example: [Roma]
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      example: 50
    PlacesLimit:
      name: limit
      in: query
      required: false
      description: |
        Page size. Places are small, so a client drawing the map can take
        every place in one request (there are about 22,000).
      schema:
        type: integer
        minimum: 1
        maximum: 25000
        default: 50
      example: 25000
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `page.next_cursor`. Omit for the first page.
      schema:
        type: string
      example: eyJvIjo1MCwicSI6IjlmMWUifQ
    RecordId:
      name: record_id
      in: path
      required: true
      description: Monument id plus 0-based inscription index.
      schema:
        $ref: '#/components/schemas/RecordId'
      example: EDCS-00000001-0
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 3f6c1a52-8e7b-4d0e-9a51-0c2f1f4e7b10

  headers:
    Link:
      description: RFC 8288 link to the next page, when there is one.
      schema:
        type: string
      example: </api/v1/inscriptions/search?q=viator&limit=50&cursor=eyJvIjo1MCwicSI6IjlmMWUifQ>; rel="next"
    ETag:
      description: Validator for a static resource.
      schema:
        type: string
      example: '"provinces-ad117-1"'

  responses:
    BadRequest:
      description: Malformed request, such as a cursor from a different query.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            staleCursor:
              value:
                type: https://epigcorpus.example/problems/cursor-mismatch
                title: Cursor does not belong to this query
                status: 400
                detail: The cursor was issued for different filters. Restart from the first page.
                instance: /api/v1/inscriptions/search?q=viator&cursor=eyJvIjo1MCwicSI6ImFhYWEifQ
    ValidationFailed:
      description: A parameter or body field is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            badSearchIn:
              value:
                type: https://epigcorpus.example/problems/validation
                title: Invalid request
                status: 422
                detail: 1 parameter is invalid.
                instance: /api/v1/inscriptions/search?q=viator&search_in=diplomatic
                errors:
                  - in: query
                    name: search_in
                    detail: must be one of raw, interpretive, conservative
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noRecord:
              value:
                type: https://epigcorpus.example/problems/not-found
                title: Not found
                status: 404
                detail: No inscription EDCS-99999999-0 in the corpus.
                instance: /api/v1/inscriptions/EDCS-99999999-0
    NotModified:
      description: The cached copy is current.
    LookupUnavailable:
      description: The lookup table has not been harvested yet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://epigcorpus.example/problems/lookup-unavailable
                title: Lookup table not available
                status: 503
                detail: data/reference/edcs_lookup.json does not exist; run a harvest.
                instance: /api/v1/lookups
    JsonlDownload:
      description: JSON Lines download.
      headers:
        Content-Disposition:
          schema:
            type: string
          example: attachment; filename="edcs_inscriptions.jsonl"
        Content-Encoding:
          description: Present when the client accepted gzip.
          schema:
            type: string
            enum: [gzip]
      content:
        application/x-ndjson:
          schema:
            type: string
          examples:
            firstLine:
              summary: First line of the raw corpus, truncated
              value: '{"edcs_id": "EDCS-00000001", "province": "Noricum", "place": "Maribor / Marburg", "latitude": 46.55563, "longitude": 15.64477, "material": "lapis", "material_en": "stone", "belege": ["ILSlov-02-01-0, 00455"], "publication": "ILSlov-02-01-0, 00455", …}'
