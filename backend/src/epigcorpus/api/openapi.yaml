      type: string
      enum: [raw, conservative, interpretive]

    Health:
      type: object
      required: [status, ready]
      properties:
        status: {const: ok}
        ready: {type: boolean, description: 'True once the corpus is in memory.'}

    PageInfo:
      type: object
      required: [limit, total, next_cursor]
      properties:
        limit:
          type: integer
        total:
          type: integer
          description: Number of items the whole query matches.
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; `null` on the last page.

    InscriptionSummary:
      description: The columns the search frame carries (`REQUIRED_COLS` in epigcorpus.models.inscription).
      type: object
      required: [record_id, edcs_id, latitude, longitude, inscription_text]
      properties:
        record_id: {$ref: '#/components/schemas/RecordId'}
        edcs_id: {type: string, pattern: '^EDCS-[0-9]{8}$'}
        province: {type: [string, 'null']}
        place: {type: [string, 'null']}
        latitude: {type: number, description: 'WGS 84; findspot or settlement level.'}
        longitude: {type: number}
        not_before: {type: [integer, 'null'], description: 'Earliest year; negative is BC.'}
        not_after: {type: [integer, 'null'], description: 'Latest year; negative is BC.'}
        language: {type: [string, 'null'], description: 'Comma-joined language names, e.g. "Greek, Latin".'}
        material_en: {type: [string, 'null']}
        category_en:
          type: array
          items: {type: string}
        inscription_text: {type: [string, 'null'], description: 'Raw EDCS text, editorial markup intact.'}
        inscription_text_interpretive: {type: [string, 'null']}
        inscription_text_conservative: {type: [string, 'null']}

    Inscription:
      description: |
        Every column of the cleaned corpus (see data/README.md for the
        schema). One row per inscription; a monument may carry several.
        Unlike the search frame, the full corpus has rows without
        coordinates.
      type: object
      required: [record_id, edcs_id, inscription_index, is_unreadable, is_forged]
      properties:
        record_id: {$ref: '#/components/schemas/RecordId'}
        edcs_id: {type: string, pattern: '^EDCS-[0-9]{8}$'}
        inscription_index: {type: integer, minimum: 0}
        province: {type: [string, 'null']}
        place: {type: [string, 'null']}
        latitude: {type: [number, 'null']}
        longitude: {type: [number, 'null']}
        material: {type: [string, 'null'], description: 'Latin token'}
        material_en: {type: [string, 'null']}
        not_before: {type: [integer, 'null'], description: 'Earliest year; negative is BC.'}
        not_after: {type: [integer, 'null'], description: 'Latest year; negative is BC.'}
        dating_from: {type: [integer, 'null']}
        dating_to: {type: [integer, 'null']}
        raw_dating: {type: [string, 'null'], description: '"101 .. 299", a bare year, or "-" if undated.'}
        inscription_text: {type: [string, 'null'], description: 'Raw EDCS text, editorial markup intact.'}
        inscription_text_conservative: {type: [string, 'null']}
        inscription_text_interpretive: {type: [string, 'null']}
        language: {type: [string, 'null']}
        language_codes:
          type: array
          items: {type: string}
        category:
          type: array
          items: {type: string}
        category_en:
          type: array
          items: {type: string}
        status:
          type: array
          items: {type: string}
        evidence:
          description: Citations (`belege` in the raw corpus). A `*` on the number marks a forgery.
          type: array
          items: {type: string}
        publication: {type: [string, 'null'], description: 'Citations joined with " | ".'}
        image_urls: {type: [string, 'null'], description: 'Image URLs joined with " | ".'}
        photo: {type: [string, 'null']}
        photo_credits: {type: [string, 'null']}
        comment: {type: [string, 'null']}
        retrieved_at: {type: string, format: date-time}
        source_url: {type: string, format: uri}
        is_unreadable: {type: boolean, description: 'Raw text empty or "?".'}
        is_forged: {type: boolean, description: 'A citation carries the EDCS falsa marker "*".'}

    InscriptionPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/InscriptionSummary'}
        page: {$ref: '#/components/schemas/PageInfo'}

    Variants:
      type: object
      required: [record_id, raw, conservative, interpretive, is_unreadable, is_forged]
      properties:
        record_id: {$ref: '#/components/schemas/RecordId'}
        raw: {type: [string, 'null']}
        conservative: {type: [string, 'null'], description: 'Approximates what is carved.'}
        interpretive: {type: [string, 'null'], description: 'The editors'' reading.'}
        is_unreadable: {type: boolean}
        is_forged: {type: boolean}

    Variant:
      type: object
      required: [record_id, variant, text]
      properties:
        record_id: {$ref: '#/components/schemas/RecordId'}
        variant: {$ref: '#/components/schemas/VariantName'}
        text: {type: [string, 'null']}

    Place:
      type: object
      required: [place, latitude, longitude, count]
      properties:
        place: {type: string, description: '"?" when EDCS records no place name.'}
        latitude: {type: number, description: 'Rounded to 5 decimals.'}
        longitude: {type: number}
        count: {type: integer, minimum: 0}

    ResultPlace:
      allOf:
        - $ref: '#/components/schemas/Place'
        - type: object
          required: [examples]
          properties:
            examples:
              description: Up to 8 matching inscriptions, "EDCS id · text" with the text cut at 160 characters.
              type: array
              maxItems: 8
              items: {type: string}

    PlacePage:
      type: object
      required: [data, page, summary]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Place'}
        page: {$ref: '#/components/schemas/PageInfo'}
        summary:
          type: object
          required: [places, inscriptions]
          properties:
            places: {type: integer, description: 'Known places, including those with no inscription.'}
            inscriptions: {type: integer, description: 'Inscriptions plotted across them.'}

    ResultPlacePage:
      type: object
      required: [data, page, summary]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ResultPlace'}
        page: {$ref: '#/components/schemas/PageInfo'}
        summary:
          description: The whole query, not just this page, as the map's match summary.
          type: object
          required: [inscriptions, places, title, subtitle]
          properties:
            inscriptions: {type: integer, description: 'Matching inscriptions.'}
            places: {type: integer, description: 'Places they are at.'}
            title: {type: string, description: 'The query in words, e.g. Inscriptions matching "viator".'}
            subtitle: {type: string, description: 'Filters and search mode in one line.'}

    FeatureCollection:
      description: A GeoJSON FeatureCollection (RFC 7946), WGS 84.
      type: object
      required: [type, features]
      properties:
        type: {const: FeatureCollection}
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: {const: Feature}
              geometry:
                type: [object, 'null']
                description: 'null when simplification left nothing to draw (RFC 7946 allows it).'
              properties: {type: [object, 'null']}

    ProvinceLabel:
      type: object
      required: [name, latitude, longitude, inscriptions, places, color]
      properties:
        name: {type: string, description: 'The EDCS province, as the province filter uses it.'}
        latitude: {type: number}
        longitude: {type: number}
        inscriptions: {type: integer, description: 'Inscriptions in the search frame.'}
        places: {type: integer, description: 'Distinct places.'}
        color:
          type: [string, 'null']
          description: 'Fill colour of the province shading under the label, as #rrggbb.'

    CityPoint:
      type: object
      required: [latitude, longitude, label]
      properties:
        latitude: {type: number}
        longitude: {type: number}
        label: {type: string}

    MaterialEntry:
      type: object
      properties:
        token: {type: string}
        en: {type: string}

    LanguageEntry:
      type: object
      properties:
        en: {type: string}
        code: {type: string}

    PlaceEntry:
      type: object
      properties:
        ort: {type: string}
        province: {type: string}
        lat: {type: [number, string], description: 'Empty string when EDCS has no coordinates.'}
        lon: {type: [number, string]}

    Lookups:
      type: object
      properties:
        materials:
          type: object
          additionalProperties: {$ref: '#/components/schemas/MaterialEntry'}
        categories:
          type: object
          additionalProperties: {$ref: '#/components/schemas/MaterialEntry'}
        provinces:
          type: array
          items: {type: string}
        languages:
          type: object
          additionalProperties: {$ref: '#/components/schemas/LanguageEntry'}
        places:
          type: object
          additionalProperties: {$ref: '#/components/schemas/PlaceEntry'}
        sources:
          type: object
          additionalProperties: {type: string}
        _meta:
          type: object
          properties:
            retrieved_at: {type: string, format: date-time}
            epigcorpus_version: {type: string}

    LookupTable:
      type: object
      required: [table, entries]
      properties:
        table:
          type: string
          enum: [materials, categories, provinces, languages, places, sources]
        entries:
          description: The table as stored; `provinces` is a list, the others are keyed by EDCS id.
          type: [object, array]

    Facets:
      type: object
      required: [values, short_forms]
      properties:
        values:
          type: object
          properties:
            material: {type: array, items: {type: string}}
            province: {type: array, items: {type: string}}
            place: {type: array, items: {type: string}}
            category: {type: array, items: {type: string}}
            language: {type: array, items: {type: string}}
        short_forms:
          type: object
          properties:
            material: {type: object, additionalProperties: {type: string}}
            category: {type: object, additionalProperties: {type: string}}
            language: {type: object, additionalProperties: {type: string}}

    PipelineRunRequest:
      type: object
      additionalProperties: false
      description: At least one of `harvest` and `clean` must be true.
      properties:
        harvest:
          type: boolean
          default: true
          description: Run the harvest stage.
        clean:
          type: boolean
          default: true
          description: Run the clean stage, then reload the corpus.
        limit:
          type: [integer, 'null']
          minimum: 1
          default: null
          description: Only harvest the first N monuments (a smoke test).
        workers:
          type: integer
          minimum: 1
          maximum: 32
          default: 16
          description: Concurrent requests to the EDCS during the harvest.
        restart:
          type: boolean
          default: false
          description: Discard the raw output and checkpoint, then harvest from the start. Destructive.
        refresh_index:
          type: boolean
          default: false
          description: Re-fetch the EDCS corpus index instead of using the cached one.

    PipelineRunStatus:
      type: string
      enum: [queued, running, cancelling, succeeded, cancelled, failed]
      description: |
        `succeeded`: every stage ran to its end; read the harvest stage's
        `result` for whether the corpus is complete. `cancelled`: stopped on
        request; a harvest resumes from its checkpoint next time. `failed`: a
        stage raised; `error` says which and why.

    PipelineStage:
      type: object
      required: [name, status, started_at, finished_at, result]
      properties:
        name: {type: string, enum: [harvest, clean, reload]}
        status:
          type: string
          enum: [pending, running, succeeded, skipped, cancelled, failed]
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        result:
          type: [string, integer, 'null']
          description: |
            harvest: its outcome. `complete`: every monument harvested,
            outputs compressed, manifest written. `incomplete`: the index was
            walked but some monuments failed (a later run retries them first).
            `partial`: `limit` stopped the walk early. `already_complete`:
            nothing to do. clean: the rows written. reload: the new corpus
            fingerprint.

    HarvestProgress:
      type: object
      properties:
        cursor: {type: integer, description: 'Monuments walked so far in the index.'}
        total: {type: integer, description: 'Monuments in the (possibly limited) index.'}
        monuments_done: {type: integer}
        rows_written: {type: integer}
        failed: {type: integer}
        rate_per_second: {type: number}
        index_fetched_at: {type: string, format: date-time}

    PipelineRun:
      type: object
      required: [id, status, request, stages, created_at, started_at, finished_at, progress, error, links]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/PipelineRunStatus'}
        request: {$ref: '#/components/schemas/PipelineRunRequest'}
        stages:
          type: array
          items: {$ref: '#/components/schemas/PipelineStage'}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        progress:
          description: The harvest's latest progress report, once it has sent one.
          oneOf:
            - $ref: '#/components/schemas/HarvestProgress'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
        links:
          type: object
          required: [self, cancel]
          properties:
            self: {type: string, format: uri-reference}
            cancel: {type: [string, 'null'], format: uri-reference}

    PlaceFeatureCollection:
      description: |
        Places as a GeoJSON FeatureCollection (RFC 7946, WGS 84): one Point
        per place, in the order of the paged endpoint. `summary` is a foreign
        member with the paged endpoint's summary.
      type: object
      required: [type, features, summary]
      properties:
        type: {const: FeatureCollection}
        summary: {type: object}
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: {const: Feature}
              geometry:
                type: object
                required: [type, coordinates]
                properties:
                  type: {const: Point}
                  coordinates:
                    description: '[longitude, latitude], rounded to 5 decimals.'
                    type: array
                    minItems: 2
                    maxItems: 2
                    items: {type: number}
              properties:
                type: object
                required: [place, count]
                properties:
                  place: {type: string}
                  count: {type: integer, minimum: 0}
                  examples:
                    description: Result places only; as in ResultPlace.
                    type: array
                    maxItems: 8
                    items: {type: string}

    Problem:
      description: RFC 9457 problem details. Extension members are allowed.
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference, default: about:blank}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
      additionalProperties: true

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [detail]
                properties:
                  in: {type: string, enum: [query, path, body, header]}
                  name: {type: string, description: 'Parameter name or JSON pointer into the body.'}
                  detail: {type: string}
