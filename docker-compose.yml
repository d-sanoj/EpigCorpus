# The API and the web UI on http://localhost:8000.
#
# data/ is mounted read-write: the server writes the Parquet snapshot of the
# cleaned corpus there, and pipeline runs write the harvest and the cleaned
# corpus. A full pipeline run peaks at about 3 GB of memory, so the usual
# Docker Desktop allowance (4 GB or more) is enough.
services:
  epigcorpus:
    build: .
    image: epigcorpus:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
